- time: "09:35 - 10:30"
  event:
    speaker: "Dashun Wang"
    title: "TBD"
    bio: "Dashun Wang is the Kellogg Chair of Technology and a Professor at the Kellogg School of Management and McCormick School of Engineering at Northwestern University. At Kellogg, he is the Founding Director of the Northwestern Innovation Institute, the Founding Co-Director of the Ryan Institute on Complexity, and the Founding Director of the Center for Science of Science and Innovation (CSSI). He is also a core faculty member at the Northwestern Institute on Complex Systems (NICO). His current research focus is the Science of Science, a quest to turn the scientific methods and curiosities upon science itself. He uses and develops tools from complexity sciences and artificial intelligence to broadly explore the opportunities for innovation and promises of prosperity offered by the recent data explosion in science. His research has been published in journals like Nature and Science, and it has been featured in virtually all major global media outlets. Dashun is a recipient of multiple awards for his research and teaching, including the AFOSR Young Investigator award, Poets &amp; Quants Best 40 Under 40 Professors, Complex Systems Society's Junior Scientific Award, the Erdos-Renyi Prize, Thinkers50 Radar, and more."

- time: "10:30 - 11:20"
  event:
    speaker: "John Hewitt"
    title: "On Weird Language Model Communication"
    bio: "John Hewitt is an Assistant Professor of Computer Science at Columbia University. He is also a Visiting Faculty Researcher at Google DeepMind. His research constructs the tools to understand what foundation models learn and how to enforce trustworthiness, safety, and control as models become increasingly capable. He's particularly happy with his teaching materials for his NLP class, COMS 4705. He received his PhD from Stanford University."

- time: "11:20 - 11:40"
  event: "Break"

- time: "11:40 - 12:10"
  event: "Q&A"

- time: "12:10 - 01:30"
  event: "Lunch / Poster session"

- time: "01:30 - 02:20"
  event:
    speaker: "Diyi Yang"
    title: "Optimizing Human-AI Collaboration"
    bio: "Diyi Yang is an assistant professor in the Computer Science Department at Stanford University, also affiliated with the Stanford NLP Group, Stanford HCI Group and Stanford Human Centered AI Institute. Her research focuses on human-centered natural language processing and human-AI interaction. She is a recipient of IEEE \"AI 10 to Watch\" (2020), Microsoft Research Faculty Fellowship (2021), NSF CAREER Award (2022), an ONR Young Investigator Award (2023), and a Sloan Research Fellowship (2024). Her work has received multiple paper awards or nominations at top NLP and HCI conferences."

- time: "02:20 - 03:10"
  event:
    speaker: "Tomer Ullman"
    title: "Beyond Simple Theory-of-Mind: Loopholes and Mindlessness"
    bio: "Tomer Ullman is a cognitive scientist interested in common-sense reasoning, and building computational models for explaining high-level cognitive processes and the acquisition of new knowledge by children and adults. In particular, he is focused on how children and adults come to form intuitive theories of agents and objects, and providing both a functional and algorithmic account of how these theories are learned. Such an account would go a long way towards explaining the basics cogs and springs of human intelligence, and support the building of more human-like artificial intelligence. Dr. Ullman received in B.Sc in Cognitive Science and Physics from Hebrew University in 2008, and his Ph.D. in Brain and Cognitive Sciences from MIT in 2015. From 2015-2018 he was a post-doctoral associate at the Center for Brains, Minds, and Machines."

